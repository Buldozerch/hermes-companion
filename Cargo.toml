[package]
name = "hermes-core"
version = "0.1.4"
edition = "2024"
description = "SSH connections and deployment planning for Hermes Desktop"

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "3"

[dependencies]
base64 = "0.22"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
dotenvy = "0.15.7"
tempfile = "3"
rand = "0.10"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
